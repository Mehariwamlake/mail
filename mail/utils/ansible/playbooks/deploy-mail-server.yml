---
- name: Deploy Mail Server
  hosts: all
  become: true

  vars:
    stalwart_root: "/etc/stalwart/{{ server_hostname }}"
    stalwart_cli_arch_map:
      x86_64: x86_64
      amd64: x86_64
      aarch64: aarch64
      arm64: aarch64

  tasks:

###############################################################################
# Directories
###############################################################################

    - name: Ensure Stalwart directories exist
      file:
        path: "{{ item }}"
        state: directory
        owner: "2000"
        group: "2000"
        mode: "0750"
      loop:
        - "{{ stalwart_root }}"
        - "{{ stalwart_root }}/data"
        - "{{ stalwart_root }}/logs"

    - name: Copy stalwart.env
      copy:
        content: "{{ stalwart_env }}"
        dest: "{{ stalwart_root }}/stalwart.env"
        owner: "2000"
        group: "2000"
        mode: "0640"

    - name: Copy bootstrap plan
      copy:
        content: "{{ stalwart_bootstrap_plan }}"
        dest: "{{ stalwart_root }}/bootstrap.ndjson"
        owner: "2000"
        group: "2000"
        mode: "0640"

    - name: Copy docker-compose.yml
      copy:
        content: "{{ docker_compose }}"
        dest: "{{ stalwart_root }}/docker-compose.yml"
        mode: "0644"

    - name: Validate docker compose
      command: docker compose config -q
      args:
        chdir: "{{ stalwart_root }}"

###############################################################################
# Docker Startup
###############################################################################

    - name: Pull latest images
      command: docker compose pull
      args:
        chdir: "{{ stalwart_root }}"
      ignore_errors: true

    - name: Start docker stack
      command: docker compose up -d --remove-orphans
      args:
        chdir: "{{ stalwart_root }}"

###############################################################################
# Wait for Bootstrap
###############################################################################

    - name: Wait for HTTP
      wait_for:
        host: 127.0.0.1
        port: 8080
        timeout: 180

    - name: Check bootstrap completion
      stat:
        path: "{{ stalwart_root }}/config.json"
      register: bootstrap_config

###############################################################################
# Detect Platform
###############################################################################

    - name: Validate architecture
      fail:
        msg: "Unsupported architecture {{ ansible_architecture }}"
      when:
        - not bootstrap_config.stat.exists
        - ansible_architecture not in stalwart_cli_arch_map

    - name: Set Stalwart CLI facts
      set_fact:
        stalwart_cli_version: "{{ stalwart_cli_version | default('v1.0.8') }}"
        stalwart_cli_arch: "{{ stalwart_cli_arch_map[ansible_architecture] }}"
        stalwart_cli_os: "unknown-linux-gnu"

        stalwart_cli_filename: >-
          stalwart-cli-{{ stalwart_cli_arch }}-{{ stalwart_cli_os }}.tar.xz

        stalwart_cli_download_url: >-
          https://github.com/stalwartlabs/cli/releases/download/{{ stalwart_cli_version }}/{{ stalwart_cli_filename }}
      when: not bootstrap_config.stat.exists

    - name: Set CLI filename
      set_fact:
        stalwart_cli_filename: "stalwart-cli-{{ stalwart_cli_arch }}-unknown-linux-gnu.tar.xz"
        stalwart_cli_download_url: "{{ stalwart_cli_release_base }}/stalwart-cli-{{ stalwart_cli_arch }}-unknown-linux-gnu.tar.xz"
      when: not bootstrap_config.stat.exists

###############################################################################
# Temporary Directory
###############################################################################

    - name: Create temporary directory
      tempfile:
        state: directory
        suffix: stalwart-cli
      register: stalwart_cli_tempdir
      when: not bootstrap_config.stat.exists

###############################################################################
# Download CLI (Python 3.14 Safe)
###############################################################################

    - name: Download Stalwart CLI
      command: >
        curl -L --fail
        "{{ stalwart_cli_download_url }}"
        -o "{{ stalwart_cli_tempdir.path }}/{{ stalwart_cli_filename }}"
      register: download_cli
      changed_when: download_cli.rc == 0
      when: not bootstrap_config.stat.exists

###############################################################################
# Extract CLI
###############################################################################

    - name: Extract archive
      unarchive:
        src: "{{ stalwart_cli_tempdir.path }}/{{ stalwart_cli_filename }}"
        dest: "{{ stalwart_cli_tempdir.path }}"
        remote_src: true
      when: not bootstrap_config.stat.exists

###############################################################################
# Locate Binary
###############################################################################

    - name: Find CLI binary
      find:
        paths: "{{ stalwart_cli_tempdir.path }}"
        recurse: true
        file_type: file
        patterns: "stalwart-cli"
      register: extracted_cli
      when: not bootstrap_config.stat.exists

    - name: Fail if CLI missing
      fail:
        msg: "stalwart-cli binary was not found after extraction."
      when:
        - not bootstrap_config.stat.exists
        - extracted_cli.matched == 0

###############################################################################
# Install CLI
###############################################################################

    - name: Install CLI
      copy:
        src: "{{ extracted_cli.files[0].path }}"
        dest: "{{ stalwart_root }}/stalwart-cli"
        remote_src: true
        mode: "0755"
      when: not bootstrap_config.stat.exists

###############################################################################
# Verify CLI
###############################################################################

    - name: Verify CLI
      command: "{{ stalwart_root }}/stalwart-cli --help"
      register: cli_check
      changed_when: false
      failed_when: false
      when: not bootstrap_config.stat.exists

    - name: Fail if CLI is not executable
      fail:
        msg: >
          {{
            cli_check.stderr
            if cli_check.stderr != ""
            else cli_check.stdout
          }}
      when:
        - not bootstrap_config.stat.exists
        - cli_check.rc != 0

###############################################################################
# Cleanup
###############################################################################

    - name: Remove temporary files
      file:
        path: "{{ stalwart_cli_tempdir.path }}"
        state: absent
      when:
        - not bootstrap_config.stat.exists
        - stalwart_cli_tempdir is defined

###############################################################################
# Apply Bootstrap
###############################################################################

    - name: Apply bootstrap plan
      command: >
        {{ stalwart_root }}/stalwart-cli apply
        --file {{ stalwart_root }}/bootstrap.ndjson
        --json
      environment:
        STALWART_URL: "http://127.0.0.1:8080"
        STALWART_USER: "{{ recovery_admin_user }}"
        STALWART_PASSWORD: "{{ recovery_admin_password }}"
      register: apply_result
      changed_when: >
        apply_result.rc == 0 and
        (
          '"created"' in apply_result.stdout or
          '"updated"' in apply_result.stdout
        )
      failed_when: false
      when: not bootstrap_config.stat.exists

###############################################################################
# Fail if Bootstrap Failed
###############################################################################

    - name: Fail if bootstrap failed
      fail:
        msg: >-
          {{
            apply_result.stdout
            if apply_result.stdout != ""
            else apply_result.stderr
          }}
      when:
        - not bootstrap_config.stat.exists
        - apply_result.rc != 0
        - "'This operation is only allowed bootstrap mode'"
          not in (apply_result.stdout | default(''))
        - "'This operation is only allowed bootstrap mode'"
          not in (apply_result.stderr | default(''))

###############################################################################
# Restart Stalwart
###############################################################################

    - name: Restart Stalwart
      command: docker compose restart stalwart
      args:
        chdir: "{{ stalwart_root }}"
      register: restart_result

###############################################################################
# Ensure Full Stack Is Running
###############################################################################

    - name: Start complete stack
      command: docker compose up -d --remove-orphans
      args:
        chdir: "{{ stalwart_root }}"
      register: compose_result

###############################################################################
# Wait for HTTP
###############################################################################

    - name: Wait for Stalwart HTTP
      wait_for:
        host: 127.0.0.1
        port: 8080
        timeout: 180

###############################################################################
# Wait for SMTP
###############################################################################

    - name: Wait for SMTP
      wait_for:
        host: 127.0.0.1
        port: 25
        timeout: 180
      ignore_errors: true

###############################################################################
# Wait for Submission
###############################################################################

    - name: Wait for Submission
      wait_for:
        host: 127.0.0.1
        port: 587
        timeout: 180
      ignore_errors: true

###############################################################################
# Wait for IMAP
###############################################################################

    - name: Wait for IMAP
      wait_for:
        host: 127.0.0.1
        port: 143
        timeout: 180
      ignore_errors: true

###############################################################################
# Docker Status
###############################################################################

    - name: Docker Compose PS
      command: docker compose ps
      args:
        chdir: "{{ stalwart_root }}"
      register: compose_ps
      ignore_errors: true

###############################################################################
# Docker Logs
###############################################################################

    - name: Last 100 container logs
      command: docker compose logs --tail=100
      args:
        chdir: "{{ stalwart_root }}"
      register: compose_logs
      ignore_errors: true

###############################################################################
# Debug
###############################################################################

    - name: Show compose status
      debug:
        var: compose_ps.stdout_lines

    - name: Show bootstrap output
      debug:
        var: apply_result.stdout_lines
      when: apply_result is defined

###############################################################################
# Success Message
###############################################################################

    - name: Deployment completed
      debug:
        msg:
          - "=========================================="
          - "Stalwart Mail deployment completed."
          - "Server: {{ server_hostname }}"
          - "Configuration: {{ stalwart_root }}"
          - "=========================================="